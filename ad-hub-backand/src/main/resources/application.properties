# Application
spring.application.name=ad-hub-backand

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/ad_hub
spring.datasource.username=postgres
spring.datasource.password=1111
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
# Не запускать приложение, если не удалось подключиться к БД
spring.datasource.hikari.initialization-fail-timeout=-1

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.defer-datasource-initialization=false
# Отключаем логирование SQL запросов
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Server
server.port=8080

# Jackson
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# JWT Configuration
jwt.secret=${JWT_SECRET:Zml0bmVzc1RyYWNrZXJTZWN1cml0eUtleTIwMjUwMDEwMTIzNDU2Nzg5MGFiY2RlZmdoaWprbG1ub3BxcnN0dXZ3eHl6QUJDREVGR0hJSktMTU5PUFFSU1RVVldYWVo=}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# Security
spring.security.oauth2.resourceserver.jwt.secret-value=${jwt.secret}

# MinIO Configuration
minio.url=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin123}
minio.bucket.avatars=${MINIO_BUCKET_AVATARS:adhub-avatars}
minio.bucket.ads-media=${MINIO_BUCKET_ADS_MEDIA:adhub-ads-media}

# File Upload Configuration
# Максимальный размер одного файла: 10MB (для изображений объявлений)
spring.servlet.multipart.max-file-size=10MB
# Максимальный размер всего запроса: 50MB (для загрузки нескольких изображений)
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true